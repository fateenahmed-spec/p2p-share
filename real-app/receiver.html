<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-43QWdXRYqoruk3xgeG1fkfclU77XwuXByfeHGbc8oj0='; worker-src 'self'; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com http://localhost:9000 ws://localhost:9000 http://localhost:9001 ws://localhost:9001 http://127.0.0.1:9001 ws://127.0.0.1:9001">
  <title>P2P Share — Receiver</title>
  <script type="importmap">{"imports":{"peerjs-js-binarypack":"./vendor/peerjs/deps/binarypack/binarypack.mjs","webrtc-adapter":"./vendor/peerjs/deps/adapter.mjs","@msgpack/msgpack":"./vendor/peerjs/deps/msgpack/index.mjs"}}</script>
</head>
<body>
  <main class="app-shell receiver-app"><h1 class="page-title">Receive a file</h1><p id="feature-status" class="feature-status" role="status"></p><p id="status" class="status-line" role="status">Checking link…</p><p class="room-line">Room: <code id="room"></code></p>
    <dl class="file-metadata"><dt>Name</dt><dd id="file-name"></dd><dt>Size</dt><dd id="file-size"></dd></dl><p class="metric-line">Control RTT: <output id="rtt" class="metric-value">—</output></p>
    <p id="transfer-progress" class="progress-line">Waiting for manifest.</p><p id="transfer-stats" class="hint-line"></p>
    <canvas id="chunk-grid" class="progress-canvas" width="900" height="12" role="img" aria-label="Chunk transfer status grid"></canvas>
    <section id="saved-file-actions" class="panel actions-panel" aria-label="Saved file actions">
      <button id="download-file" class="button button-primary" type="button" disabled>Download</button>
      <button id="save-as" class="button" type="button" hidden>Save As…</button>
      <button id="verify-file" class="button" type="button" disabled>Verify whole file</button>
      <button id="cancel-verify" class="button button-secondary" type="button" hidden>Cancel verification</button>
      <button id="offset-probe" class="button button-secondary" type="button" hidden>Run DEBUG OPFS offset probe</button>
      <button id="clear-saved-data" class="button button-secondary" type="button" hidden>Clear saved data</button>
      <p id="verify-status" class="hint-line" role="status"></p>
    </section>
    <details class="settings-panel"><summary class="settings-summary">ICE settings</summary><form id="ice-settings" class="settings-form"><label class="field-label">ICE URLs, one per line <textarea id="ice-urls" class="text-area" autocomplete="off"></textarea></label><label class="field-label">Username <input id="ice-username" class="text-input" autocomplete="off"></label><label class="field-label">Credential <input id="ice-credential" class="text-input" type="password" autocomplete="new-password"></label><label class="check-label"><input id="force-relay" type="checkbox"> Force relay</label><button class="button">Apply &amp; reconnect</button><button class="button button-secondary" type="button" id="clear-settings">Clear</button></form></details>
  </main><script type="module" src="./src/app/receiver.js"></script>
</body></html>
